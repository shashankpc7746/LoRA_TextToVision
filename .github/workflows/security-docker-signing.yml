name: Security - Docker Image Signing

on:
  workflow_run:
    workflows: ["Docker Build"]
    types:
      - completed
  push:
    branches:
      - main
      - task_quality_leap
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  sign-docker-image:
    name: Sign Docker Image with Cosign
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.3.0
        with:
          cosign-release: 'v2.2.2'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}

      - name: Sign Docker image with Cosign (keyless)
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          echo "🔐 Signing Docker images with Cosign (keyless mode)..."
          
          # Get all tags from metadata
          TAGS="${{ steps.meta.outputs.tags }}"
          
          for tag in $TAGS; do
            echo "  📝 Signing: $tag"
            
            # Sign with keyless mode (uses OIDC)
            cosign sign --yes "$tag@${{ steps.build-push.outputs.digest }}"
            
            echo "  ✅ Signed: $tag"
          done
          
          echo ""
          echo "✅ All images signed successfully"

      - name: Verify Docker image signature
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          echo "🔍 Verifying Docker image signatures..."
          
          TAGS="${{ steps.meta.outputs.tags }}"
          
          for tag in $TAGS; do
            echo "  🔎 Verifying: $tag"
            
            # Verify signature
            cosign verify "$tag@${{ steps.build-push.outputs.digest }}" \
              --certificate-identity-regexp=".*" \
              --certificate-oidc-issuer-regexp=".*"
            
            echo "  ✅ Verified: $tag"
          done
          
          echo ""
          echo "✅ All signatures verified"

      - name: Generate SBOM (Software Bill of Materials)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Sign SBOM with Cosign
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          echo "🔐 Signing SBOM..."
          
          cosign sign-blob --yes \
            --bundle cosign.bundle \
            sbom.spdx.json
          
          echo "✅ SBOM signed"

      - name: Attach SBOM to image
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          echo "📎 Attaching SBOM to image..."
          
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }}"
          
          cosign attach sbom --sbom sbom.spdx.json "$IMAGE"
          
          echo "✅ SBOM attached to image"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: |
            sbom.spdx.json
            cosign.bundle
          retention-days: 90

      - name: Generate security attestation
        run: |
          cat > attestation.json << 'EOF'
          {
            "attestation_type": "docker_image_signature",
            "image": "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}",
            "digest": "${{ steps.build-push.outputs.digest }}",
            "tags": "${{ steps.meta.outputs.tags }}",
            "signed_by": "cosign",
            "signing_method": "keyless_oidc",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "actor": "${{ github.actor }}",
            "sbom_attached": true,
            "verification_status": "signed_and_verified"
          }
          EOF
          
          echo "📋 Security Attestation:"
          cat attestation.json
          
          mkdir -p security/attestations
          cp attestation.json "security/attestations/docker-${{ github.sha }}.json"

      - name: Security scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Fail on critical vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

  verify-deployment-security:
    name: Verify Deployment Security
    runs-on: ubuntu-latest
    needs: sign-docker-image
    if: always()
    
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.3.0

      - name: Verify image before deployment
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          echo "🔒 Pre-deployment security verification..."
          
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}"
          
          # Check if image is signed
          echo "  🔍 Checking signature..."
          if cosign verify "$IMAGE" --certificate-identity-regexp=".*" --certificate-oidc-issuer-regexp=".*" > /dev/null 2>&1; then
            echo "  ✅ Image signature verified"
          else
            echo "  ❌ Image signature verification FAILED"
            echo "  🚨 DEPLOYMENT BLOCKED: Image is not signed"
            exit 1
          fi
          
          # Check if SBOM is attached
          echo "  🔍 Checking SBOM..."
          if cosign verify-attestation "$IMAGE" --type spdx > /dev/null 2>&1; then
            echo "  ✅ SBOM attached and verified"
          else
            echo "  ⚠️  SBOM not found (non-critical)"
          fi
          
          echo ""
          echo "✅ Deployment security verification passed"
          echo "🚀 Image is ready for deployment"

      - name: Generate deployment approval
        run: |
          cat > deployment-approval.json << 'EOF'
          {
            "status": "APPROVED",
            "image": "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}",
            "security_checks": [
              "signature_verified",
              "sbom_attached",
              "vulnerability_scan_passed"
            ],
            "approved_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "approved_by": "automated_security_gate",
            "commit": "${{ github.sha }}"
          }
          EOF
          
          echo "✅ Deployment Approval:"
          cat deployment-approval.json
