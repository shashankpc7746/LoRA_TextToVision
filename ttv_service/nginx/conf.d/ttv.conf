# TTV Service Server Configuration
# Main API server with SSL and security

server {
    listen 80;
    server_name ttv.bhiv.local localhost;
    
    # Redirect HTTP to HTTPS in production
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ttv.bhiv.local localhost;

    # SSL configuration
    ssl_certificate /etc/nginx/ssl/ttv.crt;
    ssl_certificate_key /etc/nginx/ssl/ttv.key;
    
    # HSTS header
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Rate limiting
    limit_req zone=api burst=20 nodelay;
    limit_conn conn_limit_per_ip 10;

    # API routes
    location /api/v1/ttv {
        proxy_pass http://ttv_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        
        # CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # Health check endpoint
    location /health {
        proxy_pass http://ttv_backend/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # Metrics endpoint (restricted)
    location /metrics {
        allow 127.0.0.1;
        allow 172.20.0.0/16;
        deny all;
        
        proxy_pass http://ttv_backend/metrics;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Static file serving for storage
    location /storage/ {
        alias /var/www/storage/;
        expires 1d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        
        # Video file handling
        location ~* \.(mp4|webm|ogg)$ {
            limit_req zone=videos burst=5 nodelay;
            expires 7d;
            add_header Accept-Ranges bytes;
        }
        
        # Image file handling
        location ~* \.(jpg|jpeg|png|gif|ico|svg)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
        
        # JSON metadata
        location ~* \.json$ {
            expires 1h;
            add_header Content-Type application/json;
        }
    }

    # Documentation (if enabled)
    location /docs {
        proxy_pass http://ttv_backend/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenAPI spec
    location /openapi.json {
        proxy_pass http://ttv_backend/openapi.json;
        proxy_set_header Host $host;
        expires 1h;
    }

    # Security: Block common attack patterns
    location ~* (\.php|\.asp|\.aspx|\.jsp)$ {
        return 444;
    }

    location ~* /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Default fallback
    location / {
        return 404;
    }
}

# Flower monitoring interface (development/staging)
server {
    listen 80;
    server_name flower.ttv.bhiv.local;
    
    # Basic auth for security
    auth_basic "Flower Monitoring";
    auth_basic_user_file /etc/nginx/.htpasswd;
    
    location / {
        proxy_pass http://flower:5555;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}