[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lora-text-to-vision"
version = "2.0.0"
description = "Adaptive Text-to-Video Generation System"
authors = [
    {name = "Shashank", email = "shashank@gurukul.ai"}
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0.0",
    "diffusers>=0.20.0",
    "transformers>=4.30.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "moviepy>=1.0.0",
    "requests>=2.31.0",
    "python-multipart>=0.0.6"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["AnimateDiff*", "AnimateDiff_API*"]

[tool.setuptools.package-dir]
"" = "."

[tool.pylance]
pythonPath = "python"
reportMissingImports = "warning"
reportMissingTypeStubs = "warning"

[tool.python]
pythonPath = "python"